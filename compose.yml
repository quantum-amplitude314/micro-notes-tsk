services:
  mariadb:
    image: docker.io/library/mariadb:12.3
    container_name: notes-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: notes
      MARIADB_USER: notes
      MARIADB_PASSWORD: notes
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
volumes:
  mariadb-data:
